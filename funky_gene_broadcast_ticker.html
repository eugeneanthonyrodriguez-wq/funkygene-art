<script>
const RACE_RESULT_URL =
  "http://localhost/_DEMOE/api/XC7563EAKS747W72CQJQVDV087HV8VEL";

const crawl = document.getElementById("crawl");


/* GET RUNNER RACE / DISTANCE */

function getRaceDistance(runner) {

  return (
    runner.Contest ||
    runner.Race ||
    runner.Competition ||
    runner.Distance ||
    runner.Event ||
    runner.ContestName ||
    ""
  );

}


async function updateRaceResults() {

  try {

    const response =
      await fetch(RACE_RESULT_URL);

    const runners =
      await response.json();


    crawl.innerHTML =
      runners
      .slice(0, 10)
      .map((runner, index) => {

        const raceDistance =
          getRaceDistance(runner);


        return `
          <div class="item">

            <span class="tag ${index === 0 ? "leader" : ""}">

              ${
                index === 0
                  ? "LEADER"
                  : runner.Split === "Finish"
                  ? "FINISHER"
                  : "SPLIT"
              }

            </span>


            <span class="bib">
              #${runner.Bib}
            </span>


            <span>
              ${runner.Name}
            </span>


            ${
              raceDistance
                ? `
                  <span class="separator">•</span>

                  <span>
                    ${raceDistance}
                  </span>
                `
                : ""
            }


            <span class="separator">•</span>


            <span>
              ${runner.Split || "ON COURSE"}
            </span>


            <span class="time">

              ${
                runner.ChipTime ||
                runner.GunTime ||
                ""
              }

            </span>

          </div>
        `;

      })
      .join("");


  }

  catch (error) {

    console.error(
      "RACE RESULT connection error:",
      error
    );

  }

}


updateRaceResults();

setInterval(
  updateRaceResults,
  20000
);
</script>
