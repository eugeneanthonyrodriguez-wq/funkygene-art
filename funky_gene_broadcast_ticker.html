<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funky Gene Live — Firetrails Live Ticker</title>
<style>
:root{--deep:#0B2D4D;--ocean:#195E7A;--green:#2A7A5E;--orange:#FF6A3D;--white:#EAEAF1;--gold:#FFD23F}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100vw;height:100vh}.ticker{position:absolute;left:0;right:0;bottom:34px;height:92px;display:flex;color:var(--white);filter:drop-shadow(0 5px 10px rgba(0,0,0,.35))}
.brand{flex:0 0 330px;display:flex;align-items:center;gap:14px;padding:0 22px;background:linear-gradient(90deg,var(--deep),var(--ocean));border-top:3px solid var(--green);border-bottom:3px solid var(--green);box-sizing:border-box;z-index:3}
.brand-sub{margin-top:7px;font-size:15px;font-weight:800;letter-spacing:1.5px;color:var(--gold);white-space:nowrap}
.window{min-width:0;flex:1;position:relative;overflow:hidden;background:rgba(11,45,77,.94);border-top:3px solid var(--green);border-bottom:3px solid var(--green);box-sizing:border-box}
.crawl{position:absolute;inset:0 auto 0 0;height:100%;display:flex;align-items:center;width:max-content;white-space:nowrap;animation:crawl 90s linear infinite;will-change:transform}
.item{display:inline-flex;align-items:center;gap:12px;padding:0 28px;height:56px;font-size:24px;font-weight:750}.item+.item{border-left:1px solid rgba(234,234,241,.27)}
.tag,.race{padding:7px 11px 6px;border-radius:4px;font-size:14px;font-weight:900;letter-spacing:1px}.tag{background:var(--green)}.tag.leader{background:var(--gold);color:var(--deep)}.tag.finish{background:var(--orange)}.race{background:var(--ocean);border:1px solid rgba(255,255,255,.25)}
.bib{color:var(--gold);font-weight:900}.time{font-weight:900}.sep{color:rgba(234,234,241,.45)}.place{color:var(--gold);font-weight:900}
@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
<link rel="stylesheet" href="firetrails_theme.css">
</head>
<body><main class="stage"><section class="ticker">
<div class="brand"><div class="event-logos compact"><span class="brand-logo firetrails-logo"></span><span class="brand-logo bay100-logo"></span></div>
<div><div class="brand-sub">LIVE RESULTS</div><div class="brand-sub">FIRETRAILS 2026</div></div></div>
<div class="window"><div class="crawl" id="crawl"><div class="item">CONNECTING TO LAUREL…</div><div class="item">CONNECTING TO LAUREL…</div></div></div>
</section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,collection,query,where,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBp8LcXhchXdToRHIOrI15c2sHY6UJvRek",authDomain:"store-9dec1.firebaseapp.com",projectId:"store-9dec1",storageBucket:"store-9dec1.appspot.com",messagingSenderId:"1054660190026",appId:"1:1054660190026:web:d165d9462ae1ac2355abb3",measurementId:"G-JCEW33JZE3"};
const EVENTS=[174258,174259,174260],NAMES={174258:"100K",174259:"50 MILE",174260:"MARATHON"},crawl=document.getElementById("crawl");
const db=getFirestore(initializeApp(firebaseConfig)),all=new Map();
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function tm(s){s=Number(s);if(!Number.isFinite(s)||s<0)return"";return Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0")}
function newestPerRunner(rows){const m=new Map();for(const r of rows){if(r.latest===false)continue;const k=String(r.participant_id??r.bib??r.id);const o=m.get(k);if(!o||Number(r.cum_dist_miles||0)>Number(o.cum_dist_miles||0)||(Number(r.cum_dist_miles||0)===Number(o.cum_dist_miles||0)&&Number(r.cum_time_seconds||0)>Number(o.cum_time_seconds||0)))m.set(k,r)}return[...m.values()]}
function rank(rows){return rows.sort((a,b)=>{const pa=Number(a.place_overall),pb=Number(b.place_overall);if(Number.isFinite(pa)&&pa>0&&Number.isFinite(pb)&&pb>0)return pa-pb;if(Number.isFinite(pa)&&pa>0)return-1;if(Number.isFinite(pb)&&pb>0)return 1;return Number(b.cum_dist_miles||0)-Number(a.cum_dist_miles||0)})}
function item(r,event,i){const p=Number(r.place_overall),finish=String(r.name||"").toLowerCase().includes("finish"),label=finish?"FINISHER":(p===1?"LEADER":"TOP 3"),cls=finish?"finish":(p===1?"leader":"");const name=[r.firstname,r.lastname].filter(Boolean).join(" ")||"RUNNER";const time=tm(r.cum_time_seconds??r.gun_time_seconds);return `<div class="item"><span class="race">${NAMES[event]}</span><span class="tag ${cls}">${label}</span>${Number.isFinite(p)&&p>0?`<span class="place">P${p}</span>`:""}<span class="bib">#${esc(r.bib??"")}</span><span>${esc(name)}</span><span class="sep">•</span><span>${esc(r.name||r.location||"ON COURSE")}</span>${time?`<span class="time">${time}</span>`:""}</div>`}
function render(){let chosen=[];for(const e of EVENTS){const rows=rank(newestPerRunner(all.get(e)||[]));chosen.push(...rows.slice(0,3).map((r,i)=>({r,e,i})))}if(!chosen.length){const x='<div class="item"><span class="tag">LIVE</span><span>CONNECTED — WAITING FOR RACE DATA</span></div>';crawl.innerHTML=x+x;return}const h=chosen.map(x=>item(x.r,x.e,x.i)).join("");crawl.innerHTML=h+h}
for(const e of EVENTS){const q=query(collection(db,"timing","scores","all"),where("race_event_id","==",e));onSnapshot(q,s=>{all.set(e,s.docs.map(d=>({id:d.id,...d.data()})));render()},err=>{console.error("Laurel Firestore",e,err);const x='<div class="item"><span class="tag finish">DATA ERROR</span><span>'+esc(err.code||err.message)+'</span></div>';crawl.innerHTML=x+x})}
</script></body></html>
