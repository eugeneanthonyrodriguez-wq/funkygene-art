<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Funky Gene Live — Firetrails Cut Transition</title>
<style>
  :root{
    --firetrails-red:#ED1B24;
    --cream:#FDF9ED;
    --brown:#956847;
    --topo-brown:#865D41;
    --charcoal:#222222;
    --sage:#8ABD9E;
    --mint:#95C4A8;
    --duration:1550ms;
  }

  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
  body{position:relative}

  .transition{
    position:absolute;inset:0;overflow:hidden;pointer-events:none;
  }

  .curtain{
    position:absolute;inset:-3%;
    background:
      linear-gradient(112deg,rgba(255,255,255,.16),transparent 27%,rgba(19,17,21,.22) 66%,rgba(255,255,255,.1)),
      linear-gradient(124deg,var(--topo-brown),var(--brown) 48%,#a97854);
    clip-path:polygon(-34% 0,-5% 0,-23% 100%,-52% 100%);
    animation:curtain-sweep var(--duration) cubic-bezier(.72,0,.2,1) both;
    box-shadow:0 0 70px rgba(0,0,0,.65);
  }

  .curtain::before{
    content:"";position:absolute;inset:0;
    background-image:url("firetrails_pattern.svg");
    background-position:center;
    background-size:cover;
    opacity:.95;
    animation:pattern-drift var(--duration) ease-in-out both;
  }

  .curtain::after{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(112deg,transparent 0 114px,rgba(253,249,237,.07) 115px 117px,transparent 118px 226px),
      radial-gradient(circle at 50% 46%,rgba(253,249,237,.13),transparent 42%);
    mix-blend-mode:screen;
  }

  .blade{
    position:absolute;top:-22vh;height:144vh;
    transform:skewX(-16deg) translateX(-155vw);
    animation:blade-sweep var(--duration) cubic-bezier(.72,0,.2,1) both;
    box-shadow:0 0 22px rgba(0,0,0,.28);
  }

  .blade--cream{left:-26vw;width:7vw;background:var(--cream);animation-delay:18ms}
  .blade--red{left:-16vw;width:16vw;background:linear-gradient(90deg,#a30e15,var(--firetrails-red) 45%,#ff4a50);animation-delay:38ms}
  .blade--sage{left:-2vw;width:4vw;background:var(--sage);animation-delay:58ms}
  .blade--shadow{left:7vw;width:2.2vw;background:var(--charcoal);animation-delay:72ms}

  .brand-lockup{
    position:absolute;left:50%;top:50%;z-index:5;
    width:min(920px,74vw);min-height:180px;
    transform:translate(-50%,-50%) scale(.92);
    display:flex;align-items:center;justify-content:center;gap:34px;
    padding:28px 42px;
    color:var(--cream);
    background:linear-gradient(100deg,rgba(34,34,34,.97),rgba(19,17,21,.9));
    border:2px solid var(--charcoal);
    outline:2px solid rgba(253,249,237,.8);
    box-shadow:
      inset 1px 1px 0 rgba(253,249,237,.5),
      inset -3px -3px 0 rgba(0,0,0,.72),
      0 0 0 5px var(--brown),
      0 0 0 7px var(--sage),
      12px 16px 0 rgba(19,17,21,.56),
      0 28px 60px rgba(0,0,0,.44);
    opacity:0;
    animation:brand-hit var(--duration) cubic-bezier(.2,.78,.22,1) both;
  }

  .brand-lockup::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:13px;
    background:var(--firetrails-red);
    box-shadow:13px 0 0 var(--sage),16px 0 0 var(--charcoal);
  }

  .transition__logos{display:flex;align-items:center;gap:24px;flex:none}
  .transition__logos .firetrails-logo{width:310px!important;height:78px!important}
  .transition__logos .bay100-logo{width:82px!important;height:82px!important;opacity:1!important}

  .transition__copy{padding-left:30px;border-left:1px solid rgba(253,249,237,.25)}
  .transition__kicker{font-size:15px;font-weight:900;letter-spacing:3px;color:var(--mint)}
  .transition__title{margin-top:8px;font-size:31px;line-height:1;font-weight:1000;letter-spacing:.5px;white-space:nowrap}
  .transition__bar{margin-top:14px;width:100%;height:5px;background:linear-gradient(90deg,var(--firetrails-red) 0 58%,var(--sage) 58% 82%,var(--cream) 82%)}

  @keyframes curtain-sweep{
    0%{clip-path:polygon(-34% 0,-5% 0,-23% 100%,-52% 100%)}
    37%,64%{clip-path:polygon(-5% 0,126% 0,108% 100%,-23% 100%)}
    100%{clip-path:polygon(126% 0,156% 0,138% 100%,108% 100%)}
  }

  @keyframes blade-sweep{
    0%{transform:skewX(-16deg) translateX(-155vw)}
    39%,62%{transform:skewX(-16deg) translateX(111vw)}
    100%{transform:skewX(-16deg) translateX(275vw)}
  }

  @keyframes brand-hit{
    0%,34%{opacity:0;transform:translate(-50%,-50%) scale(.82)}
    43%,59%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    67%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}
  }

  @keyframes pattern-drift{
    from{background-position:44% 56%;transform:scale(1.08)}
    to{background-position:56% 44%;transform:scale(1.15)}
  }

  @media(max-width:900px){
    .brand-lockup{gap:20px;padding:22px 30px;width:82vw}
    .transition__logos .firetrails-logo{width:210px!important;height:54px!important}
    .transition__logos .bay100-logo{width:58px!important;height:58px!important}
    .transition__copy{padding-left:20px}.transition__title{font-size:23px}
  }
</style>
<link rel="stylesheet" href="firetrails_theme.css" />
</head>
<body>
<main class="transition" id="transition" aria-label="Firetrails full-screen transition">
  <div class="curtain"></div>
  <div class="blade blade--cream"></div>
  <div class="blade blade--red"></div>
  <div class="blade blade--sage"></div>
  <div class="blade blade--shadow"></div>
  <section class="brand-lockup">
    <div class="event-logos transition__logos" aria-label="Dick Collins Firetrails and Bay Area 100 Series">
      <span class="brand-logo firetrails-logo" role="img" aria-label="Dick Collins Firetrails"></span>
      <span class="brand-logo bay100-logo" role="img" aria-label="Bay Area 100 Series"></span>
    </div>
    <div class="transition__copy">
      <div class="transition__kicker">FUNKY GENE LIVE</div>
      <div class="transition__title" id="transitionTitle">TRAIL TO FINISH LINE</div>
      <div class="transition__bar"></div>
    </div>
  </section>
</main>
<script>
(() => {
  const params=new URLSearchParams(location.search);
  const duration=Math.min(4000,Math.max(800,Number(params.get("duration"))||1550));
  const loop=params.get("loop")==="1";
  const title=params.get("title");
  document.documentElement.style.setProperty("--duration",duration+"ms");
  if(title) document.getElementById("transitionTitle").textContent=title.toUpperCase().slice(0,42);

  const root=document.getElementById("transition");
  function replay(){
    root.querySelectorAll(".curtain,.blade,.brand-lockup").forEach(node => {
      node.style.animation="none";
      void node.offsetWidth;
      node.style.animation="";
    });
  }

  root.querySelector(".curtain").addEventListener("animationend",() => {
    window.parent.postMessage({type:"funky-gene-transition-complete"},"*");
    if(loop) setTimeout(replay,900);
  });
})();
</script>
</body>
</html>
