<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Funky Gene Live — Top 10 Leaderboard</title>
<style>
  :root{
    --deep-blue:#0B2D4D;
    --ocean-blue:#195E7A;
    --emerald:#2A7A5E;
    --sunset-orange:#FF6A3D;
    --white:#EAEAF1;
    --gold:#FFD23F;
  }

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    background:transparent;
  }

  .board{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:1040px;
    color:var(--white);
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.42));
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:44px;
    padding:0 18px;
    background:var(--ocean-blue);
    border-radius:10px 10px 0 0;
    box-sizing:border-box;
    font-size:15px;
    font-weight:900;
    letter-spacing:1px;
  }

  .live{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--gold);
  }

  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--gold);
  }

  .headline{
    display:grid;
    grid-template-columns:1fr 220px;
    background:linear-gradient(90deg,var(--deep-blue),var(--ocean-blue));
    border-bottom:3px solid var(--emerald);
  }

  .headline > div{
    padding:16px 20px;
  }

  .title{
    font-size:32px;
    font-weight:900;
    letter-spacing:.4px;
  }

  .sub{
    margin-top:5px;
    font-size:15px;
    font-weight:800;
    color:rgba(234,234,241,.82);
  }

  .split{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(42,122,94,.48);
    text-align:center;
  }

  .split-label{
    font-size:12px;
    font-weight:900;
    letter-spacing:1.2px;
    color:var(--gold);
  }

  .split-name{
    margin-top:5px;
    font-size:20px;
    font-weight:900;
  }

  .header-row,
  .row{
    display:grid;
    grid-template-columns:76px 80px 1fr 150px 145px;
    align-items:center;
  }

  .header-row{
    min-height:36px;
    background:rgba(11,45,77,.96);
    border-bottom:1px solid rgba(234,234,241,.18);
    font-size:12px;
    font-weight:900;
    letter-spacing:1.1px;
    color:rgba(234,234,241,.78);
  }

  .rows{
    background:rgba(234,234,241,.98);
    color:var(--deep-blue);
    border-radius:0 0 10px 10px;
    overflow:hidden;
  }

  .row{
    min-height:48px;
    border-bottom:1px solid rgba(11,45,77,.16);
    font-size:18px;
    box-sizing:border-box;
  }

  .row:last-child{
    border-bottom:none;
  }

  .row:nth-child(even){
    background:rgba(11,45,77,.035);
  }

  .cell{
    padding:0 14px;
    min-width:0;
  }

  .place{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    font-size:23px;
    font-weight:900;
    background:rgba(11,45,77,.06);
  }

  .row.first .place{
    background:var(--gold);
  }

  .bib{
    font-weight:900;
    color:var(--sunset-orange);
  }

  .name{
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .time{
    text-align:right;
    font-weight:900;
  }

  .gap{
    text-align:right;
    font-weight:800;
    color:var(--ocean-blue);
  }

  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-size:13px;
    font-weight:800;
    letter-spacing:.7px;
  }

  .brand,
  .note{
    background:rgba(11,45,77,.9);
    padding:8px 11px;
  }

  .brand{
    border-left:4px solid var(--emerald);
  }
</style>
<link rel="stylesheet" href="firetrails_theme.css" />
</head>
<body>
<main class="stage">
  <section class="board" aria-label="Top ten live leaderboard">
    <div class="topbar">
      <div class="event-logos compact" aria-label="Dick Collins Firetrails and Bay Area 100">
      <span class="brand-logo firetrails-logo" role="img" aria-label="Dick Collins Firetrails"></span>
      <span class="brand-logo bay100-logo" role="img" aria-label="Bay Area 100 Series"></span>
      </div>
      <span class="live"><span class="dot"></span>LIVE RESULTS</span>
    </div>

    <div class="headline">
      <div>
        <div class="title">TOP 10 OVERALL</div>
        <div class="sub">Live race leaderboard</div>
      </div>
      <div class="split">
        <div class="split-label">LAST SPLIT</div>
        <div class="split-name" id="raceName">100K</div>
      </div>
    </div>

    <div class="header-row">
      <div class="cell" style="text-align:center;">POS</div>
      <div class="cell">BIB</div>
      <div class="cell">RUNNER</div>
      <div class="cell" style="text-align:right;">TIME</div>
      <div class="cell" style="text-align:right;">GAP</div>
    </div>

    <div class="rows" id="rows">
      <div class="row"><div class="cell place">—</div><div class="cell bib">—</div><div class="cell name">CONNECTING TO LAUREL…</div><div class="cell time">—</div><div class="cell gap">—</div></div></div>

    <div class="footer">
      <span class="brand">FUNKY GENE LIVE</span>
      <span class="note" id="status">LAUREL • CONNECTING…</span>
    </div>
  </section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{getFirestore,collection,query,where,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBp8LcXhchXdToRHIOrI15c2sHY6UJvRek",authDomain:"store-9dec1.firebaseapp.com",projectId:"store-9dec1",storageBucket:"store-9dec1.appspot.com",messagingSenderId:"1054660190026",appId:"1:1054660190026:web:d165d9462ae1ac2355abb3",measurementId:"G-JCEW33JZE3"},races=[["100K",174258],["50 MILE",174259],["MARATHON",174260]],data=new Map(),rows=document.getElementById("rows"),raceName=document.getElementById("raceName"),status=document.getElementById("status");let ri=0;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function tm(s){s=+s;if(!Number.isFinite(s)||s<0)return"—";return Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0")}function unique(a){const m=new Map();a.forEach(x=>{if(x.latest===false)return;const k=x.participant_id??x.bib??x.id,o=m.get(k);if(!o||(+x.cum_dist_miles||0)>(+o.cum_dist_miles||0)||(+x.cum_dist_miles||0)===(+o.cum_dist_miles||0)&&(+x.cum_time_seconds||0)>(+o.cum_time_seconds||0))m.set(k,x)});return[...m.values()]}function ranked(a){return unique(a).sort((a,b)=>(+a.place_overall||9999)-(+b.place_overall||9999)||(+b.cum_dist_miles||0)-(+a.cum_dist_miles||0)).slice(0,10)}
function render(){const [name,id]=races[ri],a=ranked(data.get(id)||[]);raceName.textContent=name;status.textContent="LAUREL LIVE • "+name+" • 10 SEC CYCLE";if(!a.length){rows.innerHTML='<div class="row"><div class="cell place">—</div><div class="cell bib">—</div><div class="cell name">CONNECTED — WAITING FOR '+name+' DATA</div><div class="cell time">—</div><div class="cell gap">—</div></div>';return}const lead=+a[0].cum_time_seconds||0;rows.innerHTML=a.map((x,i)=>{const p=+x.place_overall||i+1,n=[x.firstname,x.lastname].filter(Boolean).join(" ")||"RUNNER",t=+x.cum_time_seconds||+x.gun_time_seconds||0,g=i===0?"LEADER":(t&&lead?"+"+tm(t-lead):"—");return '<div class="row '+(i===0?"first":"")+'"><div class="cell place">'+p+'</div><div class="cell bib">'+esc(x.bib)+'</div><div class="cell name">'+esc(n)+'</div><div class="cell time">'+tm(t)+'</div><div class="cell gap">'+g+'</div></div>'}).join("")}const db=getFirestore(initializeApp(cfg));races.forEach(([n,id])=>onSnapshot(query(collection(db,"timing","scores","all"),where("race_event_id","==",id)),s=>{data.set(id,s.docs.map(d=>({id:d.id,...d.data()})));render()},e=>{status.textContent="LAUREL DATA ERROR";console.error(e)}));setInterval(()=>{ri=(ri+1)%races.length;render()},10000);render();
</script></body>
</html>
