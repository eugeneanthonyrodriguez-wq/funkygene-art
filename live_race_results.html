<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Race Results — Dick Collins Firetrails</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
  .stage{position:relative;width:100vw;height:100vh;background:transparent}
  .board{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(1180px,calc(100vw - 80px));color:var(--cream);
    filter:drop-shadow(0 12px 28px rgba(0,0,0,.46));
    transition:opacity .42s ease,transform .42s cubic-bezier(.55,0,.8,.25),clip-path .42s ease;
    will-change:opacity,transform,clip-path;
  }
  .board.changing{
    animation:none!important;opacity:0;
    transform:translate(-52%,-50%) scale(.985);
    clip-path:inset(0 0 0 100% round 12px)
  }
  .topbar{
    height:54px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;
    border-radius:12px 12px 0 0;border-bottom:1px solid rgba(149,196,168,.45);
  }
  .live{display:flex;align-items:center;gap:9px;color:var(--cream);font-size:14px;font-weight:900;letter-spacing:1.2px}
  .live-dot{width:10px;height:10px;border-radius:50%;animation:pulse 1.5s ease-in-out infinite}
  .headline{
    position:relative;overflow:hidden;
    display:grid;grid-template-columns:1fr 260px;min-height:104px;
    border-bottom:4px solid var(--sage);
  }
  .headline::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(108deg,transparent 0 43%,rgba(253,249,237,.16) 48%,transparent 54%);
    transform:translateX(-120%);animation:headline-scan var(--rotation,9000ms) ease-in-out infinite;
  }
  .headline-copy{padding:18px 22px}
  .eyebrow{font-size:13px;font-weight:900;letter-spacing:2px;color:var(--mint)}
  .title{margin-top:5px;font-size:34px;line-height:1;font-weight:1000;letter-spacing:.3px}
  .sub{margin-top:8px;font-size:14px;font-weight:800;color:rgba(253,249,237,.82)}
  .race-badge{
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:rgba(34,34,34,.32);border-left:1px solid rgba(253,249,237,.12)
  }
  .race-name{font-size:25px;font-weight:1000}
  .division{margin-top:5px;font-size:14px;font-weight:900;letter-spacing:1.5px;color:var(--mint)}
  .header-row,.row{
    display:grid;grid-template-columns:78px 88px 1fr 180px 190px;align-items:center
  }
  .header-row{
    min-height:38px;background:rgba(34,34,34,.97);font-size:12px;font-weight:900;
    letter-spacing:1.2px;color:rgba(253,249,237,.76)
  }
  .rows{background:rgba(253,249,237,.985);color:var(--charcoal);overflow:hidden}
  .row{min-height:52px;border-bottom:1px solid rgba(134,93,65,.23);font-size:19px}
  .row:last-child{border-bottom:0}
  .row:nth-child(even){background:rgba(149,196,168,.09)}
  .cell{padding:0 15px;min-width:0}
  .place{
    align-self:stretch;display:flex;align-items:center;justify-content:center;padding:0;
    font-size:24px;font-weight:1000;background:rgba(149,196,168,.16)
  }
  .row:first-child .place{background:var(--firetrails-red);color:var(--cream)}
  .bib{font-weight:1000;color:var(--firetrails-red)}
  .runner-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time,.distance{text-align:right;font-variant-numeric:tabular-nums;font-weight:1000}
  .distance{color:var(--ultrasignup-dark)}
  .footer{
    height:42px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;
    background:rgba(34,34,34,.95);border-radius:0 0 10px 10px;border-top:1px solid rgba(149,196,168,.25);
    color:rgba(253,249,237,.78);font-size:12px;font-weight:800;letter-spacing:.7px
  }
  .progress{display:flex;gap:7px;align-items:center}
  .progress-dot{width:8px;height:8px;border-radius:50%;background:rgba(253,249,237,.25)}
  .progress-dot.active{position:relative;width:30px;border-radius:8px;background:rgba(237,27,36,.26);overflow:hidden}
  .progress-dot.active::after{
    content:"";position:absolute;inset:0;background:var(--firetrails-red);
    transform-origin:left;animation:rotation-progress var(--rotation,9000ms) linear both;
  }
  .empty{height:520px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
  @keyframes pulse{50%{opacity:.42;transform:scale(.82)}}
  @keyframes rotation-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes headline-scan{
    0%,68%{transform:translateX(-120%);opacity:0}
    72%{opacity:1}
    90%{transform:translateX(120%);opacity:1}
    94%,100%{transform:translateX(120%);opacity:0}
  }
  @media(max-height:800px){
    .topbar{height:44px}.headline{min-height:82px}.headline-copy{padding:12px 18px}
    .title{font-size:28px}.row{min-height:43px}.empty{height:430px}
  }
  @media(prefers-reduced-motion:reduce){.board,.live-dot{transition:none;animation:none}}
</style>
<link rel="stylesheet" href="firetrails_theme.css" />
<link rel="stylesheet" href="firetrails_motion.css" />
</head>
<body>
<main class="stage">
  <section class="board" id="board" aria-live="polite" aria-label="Rotating top ten leaderboard">
    <div class="topbar firetrails-surface">
      <div class="event-logos" aria-label="Dick Collins Firetrails and Bay Area 100 Series">
        <span class="brand-logo firetrails-logo" role="img" aria-label="Dick Collins Firetrails"></span>
        <span class="brand-logo bay100-logo" role="img" aria-label="Bay Area 100 Series"></span>
      </div>
      <div class="live"><span class="live-dot"></span>LIVE RACE RESULTS</div>
    </div>
    <div class="headline firetrails-surface">
      <div class="headline-copy">
        <div class="eyebrow">TOP TEN</div>
        <div class="title" id="title">50K — MEN</div>
        <div class="sub">Elapsed time and distance completed</div>
      </div>
      <div class="race-badge">
        <div class="race-name" id="raceName">50K</div>
        <div class="division" id="division">MEN</div>
      </div>
    </div>
    <div class="header-row">
      <div class="cell" style="text-align:center">POS</div>
      <div class="cell">BIB</div>
      <div class="cell">RUNNER</div>
      <div class="cell" style="text-align:right">TIME</div>
      <div class="cell" style="text-align:right">DISTANCE RAN</div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="footer">
      <span id="status">TEST DATA • RACE RESULT CONNECTION READY</span>
      <div class="progress" id="progress" aria-label="Rotation progress"></div>
      <span id="updated">UPDATED --:--:--</span>
    </div>
  </section>
</main>
<script src="funky_gene_data_bridge.js"></script>
<script>
(() => {
  const query = new URLSearchParams(location.search);
  const requestedInterval = Number(query.get("interval"));
  const ROTATE_EVERY_MS = Math.min(60000,Math.max(4000,requestedInterval || 9000));
  document.documentElement.style.setProperty("--rotation",ROTATE_EVERY_MS + "ms");
  const views = [
    {race:"50K",gender:"M",label:"MEN"},
    {race:"50K",gender:"F",label:"WOMEN"},
    {race:"MARATHON",gender:"M",label:"MEN"},
    {race:"MARATHON",gender:"F",label:"WOMEN"},
    {race:"100 MILE",gender:"M",label:"MEN"},
    {race:"100 MILE",gender:"F",label:"WOMEN"}
  ];
  const firstNames = ["Alex","Jordan","Casey","Taylor","Morgan","Riley","Avery","Cameron","Quinn","Skyler"];
  const lastNames = ["Rivera","Chen","Johnson","Patel","Garcia","Thompson","Kim","Williams","Martinez","Brown"];
  const demo = views.flatMap((view,viewIndex) => firstNames.map((first,index) => ({
    bib: 100 + viewIndex * 20 + index + 1,
    name: first + " " + lastNames[(index + viewIndex) % lastNames.length],
    gender: view.gender,
    race: view.race,
    position: index + 1,
    time: formatDemoTime(viewIndex,index),
    distance: demoDistance(view.race,index)
  })));
  let runners = demo;
  let activeIndex = 0;

  function formatDemoTime(viewIndex,index){
    const total = 2 * 3600 + viewIndex * 2100 + index * 317;
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return [h,m,s].map((n,i) => i ? String(n).padStart(2,"0") : String(n)).join(":");
  }
  function demoDistance(race,index){
    const finish = race === "50K" ? 31.1 : race === "MARATHON" ? 26.2 : 100;
    return Math.max(finish - index * (race === "100 MILE" ? 2.8 : 1.1),0).toFixed(1) + " mi";
  }
  function value(obj,names){
    for(const name of names){
      if(obj && obj[name] !== undefined && obj[name] !== null && obj[name] !== "") return obj[name];
    }
    return "";
  }
  function normalize(raw,index){
    return {
      bib:value(raw,["bib","Bib","BibNumber","StartNo"]),
      name:value(raw,["name","Name","FullName","DisplayName","Participant"]) || "Unknown Runner",
      gender:String(value(raw,["gender","Gender","Sex"])).toUpperCase().slice(0,1),
      race:normalizeRace(value(raw,["race","Race","Contest","Competition","Event"])),
      position:Number(value(raw,["position","Position","Place","Pl","Rank","GenderPlace"])) || index + 1,
      time:value(raw,["time","Time","ElapsedTime","ChipTime","GunTime","Result"]) || "—",
      distance:formatDistance(value(raw,["distance","Distance","DistanceRan","DistanceCompleted","Miles","CourseDistance"]))
    };
  }
  function normalizeRace(value){
    const text=String(value || "").toLowerCase().replace(/\s|-/g,"");
    if(text.includes("50k") || text.includes("50km")) return "50K";
    if(text.includes("marathon") && !text.includes("half")) return "MARATHON";
    if(text.includes("100mile") || text.includes("100mi") || text === "100m") return "100 MILE";
    return String(value || "").toUpperCase();
  }
  function formatDistance(value){
    if(value === "" || value === null || value === undefined) return "—";
    if(typeof value === "number") return value.toFixed(1) + " mi";
    const text=String(value);
    return /mi|km/i.test(text) ? text : text + " mi";
  }
  function escapeHTML(value){
    return String(value).replace(/[&<>"']/g,char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
  }
  function render(){
    const view=views[activeIndex];
    const list=runners.map(normalize)
      .filter(runner => runner.race === view.race && runner.gender === view.gender)
      .sort((a,b) => a.position - b.position)
      .slice(0,10);
    document.getElementById("title").textContent=view.race + " — " + view.label;
    document.getElementById("raceName").textContent=view.race;
    document.getElementById("division").textContent=view.label;
    document.getElementById("rows").innerHTML=list.length ? list.map((runner,index) => `
      <div class="row">
        <div class="cell place">${index + 1}</div>
        <div class="cell bib">#${escapeHTML(runner.bib || "—")}</div>
        <div class="cell runner-name">${escapeHTML(runner.name)}</div>
        <div class="cell time">${escapeHTML(runner.time)}</div>
        <div class="cell distance">${escapeHTML(runner.distance)}</div>
      </div>`).join("") : '<div class="empty">WAITING FOR ' + view.race + ' ' + view.label + ' RESULTS</div>';
    document.querySelectorAll(".progress-dot").forEach((dot,index) => dot.classList.toggle("active",index === activeIndex));
    document.getElementById("updated").textContent="UPDATED " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }
  function next(){
    const board=document.getElementById("board");
    board.classList.add("changing");
    setTimeout(() => {
      activeIndex=(activeIndex + 1) % views.length;
      render();
      board.classList.remove("changing");
    },420);
  }
  function setupProgress(){
    document.getElementById("progress").innerHTML=views.map(() => '<span class="progress-dot"></span>').join("");
  }
  async function loadLiveData(){
    const config=window.FUNKY_GENE_DATA || {};
    if(config.mode !== "live" || !config.raceResultUrl) return;
    try{
      const response=await fetch(config.raceResultUrl,{cache:"no-store"});
      if(!response.ok) throw new Error("HTTP " + response.status);
      const data=await response.json();
      runners=Array.isArray(data) ? data : data.runners || data.results || data.data || [];
      document.getElementById("status").textContent="LIVE DATA • RACE RESULT";
      render();
    }catch(error){
      document.getElementById("status").textContent="CONNECTION ERROR • SHOWING LAST DATA";
      console.error(error);
    }
  }
  setupProgress();
  render();
  loadLiveData();
  setInterval(next,ROTATE_EVERY_MS);
  setInterval(loadLiveData,(window.FUNKY_GENE_DATA || {}).pollIntervalMs || 20000);
})();
</script>
</body>
</html>
